user_persona:
  name: 你
  description: ''
  bound_worldinfo: null
character:
  name: 小触
  current_preset: ''
  preset_enabled: true
modules:
  llm:
    provider: deepseek
    model: deepseek-chat
    api_key: sk-YOUR_DEEPSEEK_KEY
    base_url: https://api.deepseek.com/v1
    temperature: 0.85
    max_tokens: 1024
  vlm:
    provider: openai
    model: ark-code-latest
    api_key: YOUR_ARK_KEY
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    caption_max_tokens: 512
  stt:
    provider: faster-whisper
    model: small
    device: cpu
    compute_type: int8
    language: zh
    hf_endpoint: https://hf-mirror.com
    download_root: ''
    model_cache_dir: data/stt_cache
    funasr_model: iic/SenseVoiceSmall
    use_itn: true
    keep_emotion_tags: true
  tts:
    provider: gpt-sovits
    endpoint: http://127.0.0.1:9880
    current_voice: 默认音色
    enabled: false
    ref_audio_path: D:\ai\audio\blueArchive\ailisi\all\Aris_LogIn_1.wav
    prompt_text: ようこそ先生。アリスは先生を待っていました。
    prompt_lang: ja
    text_lang: ja
    speed_factor: 1
    text_split_method: cut0
    top_k: 5
    top_p: 1
    temperature: 1
    repetition_penalty: 1.35
    batch_size: 1
    fragment_interval: 0.3
    parallel_infer: true
  vad:
    provider: silero
    threshold: 0.5
    min_silence_ms: 800
perception:
  vision:
    enabled: true
    camera_index: 0
    frame_diff_threshold: 0.15
    min_caption_interval_s: 10
    min_look_interval_s: 30
  audio:
    enabled: false
    device_index: null
    sample_rate: 16000
    dialog_window_seconds: 15
    echo_cooldown_s: 0.6
    suspicious_repeat_window_s: 20  # 孤立短音频在此窗口内重复出现才自然确认
    reactive_repeat_threshold: 0.6  # 存疑确认回复与上一轮相似度达到此值则重试/静默
    global_wake_words:
    - hey
    - 嘿
    - 喂
proactive:
  enabled: true
  heartbeat_interval_range:
  - 20
  - 30
  quiet_start: 00:00
  quiet_end: 07:00
  min_interval_seconds: 900
  hourly_cap: 5
  max_backoff_minutes: 240
  loneliness_threshold: 0.4
  clinginess: 0.5
  ignored_grace_seconds: 300
  recent_inner_max: 5
  repeat_similarity_threshold: 0.6  # 主动发言与近期发言相似度>=此值则压回silent(去重兜底)
# 日程/待办（架构第14章）：到点投 SCHEDULE 事件走主动路径提醒。AI 用工具管理需授权
schedule:
  enabled: true
  check_interval_seconds: 30  # 调度器扫描间隔（秒）
  bypass_hourly_cap: true     # 日程提醒绕过每小时主动上限（仍受勿扰时段约束）
ai_permissions:
  allow_adjust_frequency: false
  allow_switch_preset: false
  allow_toggle_vision: false
  allow_toggle_ui: false
  allow_manage_schedules: false
ui:
  enable_visual_ui: false
  enable_webui: true
  webui_port: 8080
  webui_host: 127.0.0.1
memory:
  enabled: true
  provider: mem0
  db_path: data/memory_db
  # 反应路径记忆注入：开→每句自动 recall 注入 system；关→不自动注入，靠 LLM 调 memory_search 工具。改完即生效
  reactive_auto_recall: true
  # 已迁移到 tools.memory_search（见下方 tools 区块）；此处保留作兼容回退，新配请用 tools.memory_search
  tool_enabled: true
  llm_model: Doubao-Seed-2.0-lite
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  embedding_model: doubao-embedding-vision
  embed_base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  infer: true
  extract: true
  chat_history_window: 100
  compress_enabled: true
  compress_batch_size: 10
  reflect_daily: false
  reflect_time: 00:05
  api_key: YOUR_ARK_KEY
  embed_api_key: YOUR_ARK_KEY
# 联网搜索工具 web_search 的后端配置（开关在下方 tools.web_search）
web_search:
  # duckduckgo（默认，免费无需 key）/ tavily（结果更干净，需配 api_key）
  provider: duckduckgo
  max_results: 3
  # tavily 专用 key；duckduckgo 无需，留空
  api_key: ""
# 工具注册总开关：每个工具是否注册给 LLM（改后需重启）。管理平台「工具」页可视化编辑。
# v2.58 起统一在此管理；旧开关 memory.tool_enabled / web_search.enabled 保留作兼容回退。
tools:
  get_weather: true            # 查询天气（wttr.in 免费无 key）
  memory_search: true         # 检索关于用户的长久记忆（需 memory.enabled=true）
  web_search: false           # 联网搜索实时信息（默认关，开了才注册）
  look: true                  # 看一眼摄像头画面（需 perception.vision.enabled=true）
  add_schedule: true          # 新建提醒/待办（另受 allow_manage_schedules 授权）
  list_schedules: true        # 查看待办日程
  mark_done: true             # 标记日程完成
  update_schedule: true       # 修改日程
  delete_schedule: true       # 删除日程
  set_speaking_frequency: true  # 调整主动说话频率（另受权限页授权）
  toggle_vision: true         # 开关视觉感知（另受权限页授权）
  switch_preset: true         # 切换预设配置（另受权限页授权）
  get_my_status: true         # 查看自己状态（只读）
worldinfo:
  budget_chars: 2000
global_worldbooks: []
limits:
  daily_output_tokens: 0
  warn_at_percent: 80
  degraded_mode: local_only
token_intensive:
  # 已实现的优化（其余 8 个方向见 docs/Token密集型优化方案.md，待实现时再加开关）
  proactive_cot: true
  memory_query_generation: true
reply_review:
  # 回复审查机制：对 AI 反应路径回复做机械审查（循环重复/过长/系统标记泄漏），
  # 不合格则再调一轮 LLM 在原回复上最小修正（非重新生成）。
  # ⚠️ 开启代价：反应路径回复【不走流式】（需缓存全文审查后再播，出声变慢），
  #    且不合格时会【多一轮 LLM 调用】。默认关闭，按需开启。
  enabled: false
  max_length: 400  # 回复可见正文超过此字数判为过长（0=不查长度）
sprite:
  # 桌面立绘浮窗 + 系统托盘（PyQt6 独立进程，随主程序常驻）。
  # enabled=true 启动时显示浮窗；enabled=false 仅托盘常驻、浮窗可由托盘唤出。
  # 需先 pip install PyQt6（未装则跳过整个浮窗/托盘子系统）。改后需重启。
  # 立绘库放 data/characters/{角色}/sprites/sprites.json
  enabled: false
  host: 127.0.0.1
  port: 17621
  bubble_timeout: 5  # 台词气泡超时秒数（说完一句后停这么久消失，0=不消失一直显示）
  face_reset_timeout: 8  # 表情切换后过这么久自动回 neutral（0=不恢复，一直停最后表情）
  motion:  # 立绘情绪抖动（表情切换时上下跳/左右晃几下，蔚蓝档案式，衰减归零）
    enabled: true            # 开则表情切换时抖一下
    amplitude: 14            # 抖动幅度（px），0=不动
    duration_ms: 500         # 单次抖动时长（ms）
    bounces: 3               # 抖几下（衰减正弦周期数）
    decay: 3.5               # 衰减速率，越大停得越快
logging:
  enabled: true
  level: DEBUG
  dir: data/logs
  backup_count: 14
